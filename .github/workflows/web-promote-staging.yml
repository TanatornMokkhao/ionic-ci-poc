name: "Promote to staging"

# Puts the code as it was right after one merged PR onto staging, so the client can test
# "up to PR 15" while later PRs keep landing on main. Leave pr empty to promote main's head.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Merged PR number to promote (empty = latest main)
        type: string
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find the commit
        id: pick
        env:
          PR: ${{ inputs.pr }}
        run: |
          if [ -z "$PR" ]; then
            SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
            LABEL="main@${SHA:0:7}"
          else
            read -r STATE SHA TITLE <<< "$(gh pr view "$PR" -R "${{ github.repository }}" --json state,mergeCommit,title --jq '"\(.state) \(.mergeCommit.oid // "") \(.title)"')"
            if [ "$STATE" != MERGED ] || [ -z "$SHA" ]; then
              echo "PR #$PR is $STATE, not merged. Only merged PRs can go to staging."; exit 1
            fi
            LABEL="PR #$PR (${SHA:0:7})"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ steps.pick.outputs.label }}
          VITE_API_ENV: staging

      # Stands in for "aws s3 sync dist/ s3://<staging bucket>" + a CloudFront invalidation.
      - uses: actions/upload-artifact@v4
        with:
          name: web-staging-${{ steps.pick.outputs.sha }}
          path: dist

      - name: What is on staging now
        env:
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          {
            echo "### Staging now runs ${{ steps.pick.outputs.label }}"
            echo ""
            echo "Last 10 changes included:"
            git log --oneline -10 "$SHA" | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
