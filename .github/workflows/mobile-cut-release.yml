name: "Mobile: cut release branch"

# Option C for the apps: on a fixed cadence, cut release/X.Y from main and build X.Y.0 for the
# test channels. main moves on; fixes reach the release through cherry-pick PRs, and every merge
# into release/X.Y builds the next patch (see mobile-release-branch.yml).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 2 * * 1'   # Mondays 02:00 UTC; add a week-parity check for every other week

permissions:
  contents: write

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  cut:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.cut.outputs.branch }}
      version: ${{ steps.cut.outputs.version }}
      build_number: ${{ steps.cut.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cut the next release branch
        id: cut
        run: |
          LAST=$(git ls-remote --heads origin 'release/*' | sed 's#.*refs/heads/release/##' | grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$LAST" ]; then NEXT=1.0; else NEXT="${LAST%%.*}.$(( ${LAST##*.} + 1 ))"; fi
          BRANCH="release/$NEXT"
          git push origin "HEAD:refs/heads/$BRANCH"
          git tag "app-v$NEXT.0" HEAD && git push origin "app-v$NEXT.0"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT.0" >> "$GITHUB_OUTPUT"
          echo "build_number=$(( ${{ github.run_number }} + 900 ))" >> "$GITHUB_OUTPUT"
          echo "### Cut $BRANCH from main@${GITHUB_SHA:0:7}, building $NEXT.0" >> "$GITHUB_STEP_SUMMARY"

  android:
    needs: cut
    uses: ./.github/workflows/android.yml
    secrets: inherit
    with:
      ref: ${{ needs.cut.outputs.branch }}
      version_name: ${{ needs.cut.outputs.version }}
      version_code: ${{ needs.cut.outputs.build_number }}
      api_env: prod
      upload_play: true

  ios:
    needs: cut
    uses: ./.github/workflows/ios.yml
    secrets: inherit
    with:
      ref: ${{ needs.cut.outputs.branch }}
      version_name: ${{ needs.cut.outputs.version }}
      build_number: ${{ needs.cut.outputs.build_number }}
      api_env: prod
